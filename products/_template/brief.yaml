# brief.yaml — артефакт фазы 1 IDEA (см. docs/tool/phases.md)
# Цель: за один экран зафиксировать гипотезу так, чтобы фаза 2 MARKET знала
# где искать конкурентов и под какой ценовой коридор.

id: "2026-MM-NNN-slug"            # YYYY-MM-NNN-slug, после CARD меняется на реальный SKU
created_at: "YYYY-MM-DD"

source:                           # откуда родилась идея
  type: ""                        # mpstats | expertise | competitor | other
  ref: ""                         # ссылка на карточку/категорию/обсуждение

hypothesis: |
  Одно предложение: что за товар, для кого, чем отличается от топ-3.

category_guess:
  marketplace: ""                 # wb | ozon | both
  path: ""                        # напр. "Электроинструменты/Шуруповёрты/Аккумуляторные"

price_range_guess:                # ориентир, уточняется в MARKET
  min_rub: 0
  max_rub: 0
  median_competitor_rub: 0        # медиана топ-3, если уже посмотрели

usp_draft: |
  Одна фраза: чем закрываем боль, которую топ-3 не закрывают.

existing_ourself:                 # анти-фильтр, фаза 1 (phases.md, п.2)
  is_overlapping: false           # пересекается ли с текущим ассортиментом селлера
  overlap_category: ""            # какая именно из: строй / наборы / ручной / автоинструмент
  manual_override:
    accepted: false
    reason: ""                    # почему всё равно идём, несмотря на каннибализацию

synergy:                          # фаза 1, п.3 — синергия со складом/логистикой/экспертизой
  warehouse: ""                   # габариты вписываются в текущую логистику? да/нет/комментарий
  expertise: ""                   # опыт по этому типу товара у нас есть? да/нет/комментарий
