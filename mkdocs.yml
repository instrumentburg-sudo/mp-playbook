site_name: Конвейер новинок — WB / Ozon
site_description: Методичка и инструмент вывода новых товаров на Wildberries и Ozon (апрель 2026)
site_url: https://instrumentburg-sudo.github.io/mp-playbook/
site_author: ИнструментБург
repo_url: https://github.com/instrumentburg-sudo/mp-playbook
repo_name: instrumentburg-sudo/mp-playbook
edit_uri: edit/main/docs/
copyright: "ИнструментБург · обновлено 23.04.2026"

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/rocket-launch
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ru
        - en
  - glightbox

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Главная: index.md
  - Курс (конвейер новинок):
      - Методология: course/01-methodology.md
      - Выбор товара и 1688: course/02-product-search.md
      - Юнит-экономика: course/03-unit-economics.md
      - SEO и карточка: course/04-seo-card.md
      - Запуск и реклама: course/05-launch-ads.md
  - Правки на 2026:
      - Best practices: updates/best-practices-2026.md
      - API лимиты WB/Ozon/MPStats: updates/api-limits.md
  - Инструмент:
      - Дизайн-драфт: tool/design.md
      - Принятые решения: tool/decisions.md
      - Фазы и гейты: tool/phases.md
